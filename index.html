<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minuto a Minuto · Resultados en vivo</title>
<meta name="theme-color" content="#08090B">
<style>
  :root{--bg:#08090b;--txt:#f4f4f2;--mut:#9a9a94;--accent:#c6ff3a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100dvh;text-align:center;padding:24px}
  .wrap{max-width:360px}
  .logo{font-weight:900;letter-spacing:.14em;font-size:26px;line-height:1.15}
  .logo b{color:var(--accent)}
  .sub{color:var(--mut);margin-top:12px;font-size:15px}
  .spin{width:34px;height:34px;margin:26px auto 14px;border:3px solid #ffffff22;border-top-color:var(--accent);
    border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .msg{color:var(--mut);font-size:14px;min-height:20px}
  .btn{display:none;margin-top:18px;padding:13px 22px;border-radius:999px;background:var(--accent);color:#1a1205;
    font-weight:800;text-decoration:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">MINUTO<br><b>A MINUTO</b></div>
    <div class="sub">Resultados deportivos en vivo</div>
    <div class="spin" id="spin"></div>
    <div class="msg" id="msg">Abriendo la app…</div>
    <a class="btn" id="btn" href="#">Entrar a la app →</a>
  </div>
<script>
(async () => {
  const msg = document.getElementById("msg"), btn = document.getElementById("btn"), spin = document.getElementById("spin");
  try {
    const r = await fetch("url.txt?t=" + Date.now(), { cache: "no-store" });
    const u = (await r.text()).trim();
    if (u && /^https:\/\/.+/.test(u)) {
      btn.href = u; btn.style.display = "inline-block";
      location.replace(u);
      return;
    }
    throw new Error("sin url");
  } catch (e) {
    spin.style.display = "none";
    msg.textContent = "El piloto no está disponible en este momento. Intenta de nuevo en un rato.";
  }
})();
</script>
</body>
</html>
